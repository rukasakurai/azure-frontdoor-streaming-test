name: E2E Infrastructure & Streaming Test

on:
  workflow_dispatch:
    inputs:
      cleanup:
        description: "Run azd down after tests"
        required: false
        type: boolean
        default: true
      environment:
        description: "azd environment name"
        required: false
        type: string
      location:
        description: "Azure region"
        required: false
        type: string
        default: "japaneast"

permissions:
  id-token: write
  contents: read

env:
  AZD_ENVIRONMENT: ${{ inputs.environment || format('gha-e2e-{0}-{1}', github.run_id, github.run_attempt) }}
  AZD_LOCATION: ${{ inputs.location || 'japaneast' }}

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate azd with federated credential
        run: |
          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "=== azd auth login attempt $i/$MAX_RETRIES ==="
            if azd auth login --client-id "${{ vars.AZURE_CLIENT_ID }}" --federated-credential-provider github --tenant-id "${{ secrets.AZURE_TENANT_ID }}"; then
              echo "azd auth login succeeded on attempt $i"
              break
            fi
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "::error::azd auth login failed after $MAX_RETRIES attempts"
              exit 1
            fi
            case "$i" in
              1) WAIT=15 ;;
              2) WAIT=30 ;;
              *) WAIT=60 ;;
            esac
            echo "::warning::azd auth login failed (attempt $i/$MAX_RETRIES). Retrying in ${WAIT}s..."
            sleep "$WAIT"
          done

      - name: Initialize azd environment
        run: |
          azd env new "$AZD_ENVIRONMENT" || true
          azd env select "$AZD_ENVIRONMENT"
          azd env set AZURE_LOCATION "$AZD_LOCATION"
          azd env set AZURE_SUBSCRIPTION_ID "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_RESOURCE_GROUP "rg-$AZD_ENVIRONMENT"

      - name: Create resource group
        run: |
          args=(-n "rg-$AZD_ENVIRONMENT" -l "$AZD_LOCATION")
          if [ -n "$RG_TAG_NAME" ]; then
            args+=(--tags "$RG_TAG_NAME=$RG_TAG_VALUE")
          fi
          az group create "${args[@]}"
        env:
          RG_TAG_NAME: ${{ secrets.RG_TAG_NAME }}
          RG_TAG_VALUE: ${{ secrets.RG_TAG_VALUE }}

      - name: Provision infrastructure (azd provision)
        run: azd provision --no-prompt

      - name: Deploy application (azd deploy with retries)
        run: |
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "=== azd deploy attempt $i/$MAX_RETRIES ==="
            if azd deploy; then
              echo "azd deploy succeeded on attempt $i"
              break
            fi
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "::error::azd deploy failed after $MAX_RETRIES attempts"
              exit 1
            fi
            WAIT=$((i * 30))
            echo "::warning::azd deploy failed (attempt $i/$MAX_RETRIES). Retrying in ${WAIT}s..."
            sleep "$WAIT"
          done

      - name: Extract deployment URLs
        id: urls
        run: |
          SERVICE_APP_URI=$(azd env get-value SERVICE_APP_URI)
          AFD_URI=$(azd env get-value AFD_URI)
          AFD_BASELINE_URI=$(azd env get-value AFD_BASELINE_URI)
          LOG_ANALYTICS_WORKSPACE_CUSTOMER_ID=$(azd env get-value LOG_ANALYTICS_WORKSPACE_CUSTOMER_ID)
          echo "direct_url=$SERVICE_APP_URI" >> "$GITHUB_OUTPUT"
          echo "afd_url=$AFD_URI" >> "$GITHUB_OUTPUT"
          echo "afd_baseline_url=$AFD_BASELINE_URI" >> "$GITHUB_OUTPUT"
          echo "workspace_customer_id=$LOG_ANALYTICS_WORKSPACE_CUSTOMER_ID" >> "$GITHUB_OUTPUT"
          echo "Direct URL: $SERVICE_APP_URI"
          echo "AFD URL: $AFD_URI"
          echo "AFD baseline URL: $AFD_BASELINE_URI"

      - name: Verify origin health before waiting for AFD
        run: |
          echo "Checking origin App Service health..."
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${{ steps.urls.outputs.direct_url }}/health" || echo "000")
            echo "Origin attempt $i/12 – HTTP $status"
            if [ "$status" = "200" ]; then
              echo "Origin is healthy"
              break
            fi
            if [ "$i" = "12" ]; then
              echo "::warning::Origin did not return 200 after 12 attempts – AFD may also fail"
            fi
            sleep 5
          done

      - name: Wait for Front Door endpoint to become ready
        run: |
          AFD_HEALTH="${{ steps.urls.outputs.afd_url }}/health"
          MAX_ATTEMPTS=90
          WAIT_INTERVAL=20
          echo "Waiting for AFD endpoint to respond at $AFD_HEALTH (up to $((MAX_ATTEMPTS * WAIT_INTERVAL / 60)) min)..."
          ready=false
          for i in $(seq 1 $MAX_ATTEMPTS); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$AFD_HEALTH" || echo "000")
            if [ "$status" = "200" ]; then
              echo "Attempt $i/$MAX_ATTEMPTS – HTTP $status – AFD endpoint is ready"
              ready=true
              break
            fi
            echo "Attempt $i/$MAX_ATTEMPTS – HTTP $status – waiting ${WAIT_INTERVAL}s..."
            sleep "$WAIT_INTERVAL"
          done
          if [ "$ready" != "true" ]; then
            echo "::error::AFD endpoint did not become ready after $MAX_ATTEMPTS attempts (~$((MAX_ATTEMPTS * WAIT_INTERVAL / 60)) min)"
            echo "--- Final diagnostic: verbose curl ---"
            curl -sv --max-time 15 "$AFD_HEALTH" 2>&1 || true
            echo "--- DNS lookup ---"
            AFD_HOST=$(echo "$AFD_HEALTH" | sed 's|https://||;s|/.*||')
            nslookup "$AFD_HOST" 2>&1 || true
            exit 1
          fi

      - name: Wait for Front Door streaming routes to become ready
        run: |
          check_stream_route() {
            local endpoint="$1"
            local expected_content_type="$2"
            local url="${{ steps.urls.outputs.afd_url }}$endpoint"
            local headers status content_type
            headers=$(curl -sS -I --max-time 15 "$url" 2>/dev/null || true)
            status=$(awk 'tolower($0) ~ /^http\// {code=$2} END{print code}' <<< "$headers")
            content_type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/\r$/,""); value=substr($0,index($0,":")+2)} END{print value}' <<< "$headers")
            if [ "$status" = "200" ] && [[ "$content_type" == "$expected_content_type"* ]]; then
              return 0
            fi
            echo "$endpoint not ready: HTTP ${status:-unknown}, Content-Type '${content_type:-unknown}'"
            return 1
          }

          MAX_ATTEMPTS=30
          WAIT_INTERVAL=20
          echo "Waiting for AFD streaming routes to return expected content types (up to $((MAX_ATTEMPTS * WAIT_INTERVAL / 60)) min)..."
          ready=false
          for i in $(seq 1 $MAX_ATTEMPTS); do
            if check_stream_route /sse text/event-stream && check_stream_route /ndjson application/x-ndjson; then
              echo "Attempt $i/$MAX_ATTEMPTS – streaming routes are ready"
              ready=true
              break
            fi
            echo "Attempt $i/$MAX_ATTEMPTS – waiting ${WAIT_INTERVAL}s..."
            sleep "$WAIT_INTERVAL"
          done
          if [ "$ready" != "true" ]; then
            echo "::error::AFD streaming routes did not become ready after $MAX_ATTEMPTS attempts"
            curl -svI --max-time 15 "${{ steps.urls.outputs.afd_url }}/sse" 2>&1 || true
            curl -svI --max-time 15 "${{ steps.urls.outputs.afd_url }}/ndjson" 2>&1 || true
            exit 1
          fi

      - name: Run streaming test
        run: |
          chmod +x test.sh
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "=== streaming test attempt $i/$MAX_RETRIES ==="
            if ./test.sh "${{ steps.urls.outputs.direct_url }}" "${{ steps.urls.outputs.afd_url }}"; then
              echo "streaming test succeeded on attempt $i"
              break
            fi
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "::error::streaming test failed after $MAX_RETRIES attempts"
              exit 1
            fi
            WAIT=$((i * 120))
            echo "::warning::streaming test failed (attempt $i/$MAX_RETRIES). Retrying in ${WAIT}s..."
            sleep "$WAIT"
          done

      - name: Refresh Azure auth before Log Analytics polling
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Refresh azd auth before Log Analytics polling
        run: |
          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "=== azd auth refresh attempt $i/$MAX_RETRIES ==="
            if azd auth login --client-id "${{ vars.AZURE_CLIENT_ID }}" --federated-credential-provider github --tenant-id "${{ secrets.AZURE_TENANT_ID }}"; then
              echo "azd auth refresh succeeded on attempt $i"
              break
            fi
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "::error::azd auth refresh failed after $MAX_RETRIES attempts"
              exit 1
            fi
            case "$i" in
              1) WAIT=15 ;;
              2) WAIT=30 ;;
              *) WAIT=60 ;;
            esac
            echo "::warning::azd auth refresh failed (attempt $i/$MAX_RETRIES). Retrying in ${WAIT}s..."
            sleep "$WAIT"
          done

      - name: Run Log Analytics KQL regression test
        run: |
          chmod +x log-test.sh
          ./log-test.sh "${{ steps.urls.outputs.workspace_customer_id }}" "${{ steps.urls.outputs.afd_url }}"

      # cache-test.sh and auth-cache-test.sh are deliberately not part of this gate yet.
      # cache-test.sh's 2026-07-09 run saw only 20 of the 24 expected FrontDoorAccessLog
      # rows inside a 15-minute polling window. The cause was never pinned down --
      # ingestion latency, the polling window and the test itself are all still on the
      # table -- and gating on an unexplained shortfall would either block merges or
      # invite weakening the assertion. auth-cache-test.sh is excluded for a different
      # reason: it is an experiment rather than a regression check, so a changed result
      # is a finding to read, not a build to fail. Its three 2026-07-29 runs all reached
      # the full expected row count, so they do not reproduce the cache-test.sh shortfall
      # and should not be cited as evidence about it either way.
      # Run them manually:
      #   ./cache-test.sh <workspace-customer-id> <afd-baseline-url> <afd-url>
      #   ./auth-cache-test.sh <workspace-customer-id> <afd-url> <direct-url>

      - name: Cleanup (azd down)
        if: always() && (inputs.cleanup != false || github.event_name == 'pull_request')
        run: |
          MAX_RETRIES=4
          for i in $(seq 1 $MAX_RETRIES); do
            echo "=== pre-cleanup azd auth attempt $i/$MAX_RETRIES ==="
            if azd auth login --client-id "${{ vars.AZURE_CLIENT_ID }}" --federated-credential-provider github --tenant-id "${{ secrets.AZURE_TENANT_ID }}"; then
              echo "pre-cleanup azd auth succeeded on attempt $i"
              break
            fi
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "::error::pre-cleanup azd auth failed after $MAX_RETRIES attempts"
              exit 1
            fi
            case "$i" in
              1) WAIT=15 ;;
              2) WAIT=30 ;;
              *) WAIT=60 ;;
            esac
            echo "::warning::pre-cleanup azd auth failed (attempt $i/$MAX_RETRIES). Retrying in ${WAIT}s..."
            sleep "$WAIT"
          done

          azd down --no-prompt --force --purge
